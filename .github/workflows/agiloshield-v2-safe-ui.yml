name: AgiloShield V2 safe UI baseline

on:
  push:
    branches:
      - codex/agiloshield-v2-safe-ui-baseline-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CNOEC_Agiloshield_Docs/anonymisation/v2-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove runtime JS is restored unchanged
        run: |
          test "$(git hash-object agiloshield-v2-embed.js)" = "af8ef752b628dd0c1188f4bf9d613d48b5083210"
      - name: JavaScript syntax
        run: |
          node --check agiloshield-v2-embed.js
          node --check agiloshield-v2-client.js
          node --check agiloshield-v2-lists.js
          node --check agiloshield-v2-location.js
          node --check agiloshield-v2-auth.js
      - name: Front contract tests
        run: |
          node tests/agiloshield-v2-client.test.mjs
          node tests/agiloshield-v2-lists.test.mjs
          node tests/agiloshield-v2-location.test.mjs
          node tests/agiloshield-v2-auth.test.mjs
      - name: CSS integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path("agiloshield-v2.css").read_text(encoding="utf-8")
          assert css.count("{")==css.count("}"), "Unbalanced CSS braces"
          assert "SAFE UI BASELINE" in css
          for selector in [
              ".asv2-last-doc",
              ".asv2-drawer-head",
              ".asv2-workspace",
              ".asv2-viewer-toolbar",
              ".asv2-manual-mask-btn.is-active",
              "@media(max-width:700px)",
          ]:
              assert selector in css, selector
          print("safe UI CSS: PASS")
          PY
