<!-- Dashboard premium : 1 seul embed en bas de page (HORS embed anonymisation) -->
<!-- Ne pas coller skill-generator-embed.html ici — chargement lazy via CDN -->
<div id="ags-drawer-system" class="ags-drawer-system" hidden aria-hidden="true">
  <div class="ags-drawer-backdrop" data-ags-drawer-close tabindex="-1"></div>
  <aside class="ags-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="ags-drawer-title">
    <header class="ags-drawer-head">
      <div class="ags-drawer-head-brand">
        <img
          class="ags-drawer-logo"
          src="https://cdn.prod.website-files.com/6815bee5a9c0b57da18354fb/6a1f116a08744afd7c5e0ee9_claude-color.png"
          alt=""
          width="24"
          height="24"
          decoding="async"
        />
        <div class="ags-drawer-head-text">
          <h2 id="ags-drawer-title" class="ags-drawer-title">Claude Cowork</h2>
          <p class="ags-drawer-subtitle">Configurer votre skill Agiloshield</p>
        </div>
      </div>
      <button type="button" class="ags-drawer-close" data-ags-drawer-close aria-label="Fermer">×</button>
    </header>
    <div id="ags-drawer-mount" class="ags-drawer-body" data-ags-in-drawer></div>
  </aside>
</div>

<div id="ags-upsell-overlay" class="ags-upsell-overlay" hidden aria-hidden="true">
  <div class="ags-upsell-backdrop" data-ags-upsell-close tabindex="-1"></div>
  <div
    class="ags-upsell-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ags-upsell-title"
  >
    <button type="button" class="ags-upsell-close" data-ags-upsell-close aria-label="Fermer">×</button>
    <img
      class="ags-upsell-logo"
      src="https://cdn.prod.website-files.com/6815bee5a9c0b57da18354fb/6a1f116a08744afd7c5e0ee9_claude-color.png"
      alt=""
      width="48"
      height="48"
      decoding="async"
    />
    <h2 id="ags-upsell-title" class="ags-upsell-title">Intégration Claude Cowork</h2>
    <p class="ags-upsell-text">
      La génération de skill Agiloshield est réservée aux abonnés
      <strong>Agiloshield Classic</strong>.
    </p>
    <p class="ags-upsell-text ags-upsell-text--muted">
      Pseudonymisez vos documents dans Claude avant toute analyse — sans exposer vos données sensibles.
    </p>
    <a class="ags-upsell-cta" href="/tools/agiloshield/tarifs">Voir les tarifs Agiloshield →</a>
    <button type="button" class="ags-upsell-ghost" data-ags-upsell-close">Fermer</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var EMBED_CDN =
    "https://cdn.jsdelivr.net/gh/Agilotext/Agilotext-Scripts-Public@bf4ac55/CNOEC_Agiloshield_Docs/Agiloshield-Skill/skill-generator-embed.html";

  var AGILOSHIELD_CLASSIC_PRICE_ID = "prc_classic-mensuel-3u5vr0uq5";
  var ACTIVE_STATUSES = { ACTIVE: true, TRIALING: true, GRACE: true };
  var PRICING_BASE = "/tools/agiloshield/tarifs";
  var RETURN_PATH = "/tools/agiloshield/premium/anonymisation";

  var system = document.getElementById("ags-drawer-system");
  var mount = document.getElementById("ags-drawer-mount");
  var upsellOverlay = document.getElementById("ags-upsell-overlay");
  if (!system || !mount) return;

  var embedLoaded = false;
  var embedLoading = false;
  var gateClickInProgress = false;

  function rehydrateScripts(container) {
    var scripts = Array.prototype.slice.call(container.querySelectorAll("script"));
    return new Promise(function (resolve) {
      function runNext(i) {
        if (i >= scripts.length) return resolve();
        var old = scripts[i];
        var type = (old.getAttribute("type") || "").toLowerCase();
        if (type === "application/json" || type === "text/json") {
          return runNext(i + 1);
        }
        var s = document.createElement("script");
        if (old.src) {
          s.src = old.src;
          s.onload = function () {
            old.remove();
            runNext(i + 1);
          };
          s.onerror = function () {
            console.error("[Agiloshield skill drawer] script load failed", old.src);
            old.remove();
            runNext(i + 1);
          };
          old.parentNode.replaceChild(s, old);
        } else {
          s.textContent = old.textContent;
          old.parentNode.replaceChild(s, old);
          runNext(i + 1);
        }
      }
      runNext(0);
    });
  }

  function loadEmbed() {
    if (embedLoaded || embedLoading) return Promise.resolve();
    embedLoading = true;
    mount.innerHTML =
      '<div class="ags-drawer-loading"><div class="ags-drawer-spinner" aria-hidden="true"></div><p>Chargement…</p></div>';

    return fetch(EMBED_CDN)
      .then(function (r) {
        if (!r.ok) throw new Error("CDN " + r.status);
        return r.text();
      })
      .then(function (html) {
        mount.innerHTML = "";
        var wrap = document.createElement("div");
        wrap.innerHTML = html;
        while (wrap.firstChild) mount.appendChild(wrap.firstChild);
        return rehydrateScripts(mount);
      })
      .then(function () {
        embedLoaded = true;
      })
      .catch(function (e) {
        console.error("[Agiloshield skill drawer]", e);
        mount.innerHTML =
          '<p class="ags-drawer-error">Impossible de charger le générateur. Rechargez la page.</p>';
      })
      .finally(function () {
        embedLoading = false;
      });
  }

  function openDrawer() {
    system.hidden = false;
    system.setAttribute("aria-hidden", "false");
    system.classList.add("ags-drawer-system--open");
    document.documentElement.classList.add("ags-drawer-open");
    loadEmbed().then(function () {
      var closeBtn = system.querySelector(".ags-drawer-close");
      if (closeBtn) closeBtn.focus();
    });
  }

  function closeDrawer() {
    system.classList.remove("ags-drawer-system--open");
    system.hidden = true;
    system.setAttribute("aria-hidden", "true");
    document.documentElement.classList.remove("ags-drawer-open");
  }

  function sleep(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function normalizeStatus(s) {
    return String(s || "").toUpperCase();
  }

  function getConnections(m) {
    return Array.isArray(m && m.planConnections) ? m.planConnections : [];
  }

  function getPlans(m) {
    return Array.isArray(m && m.plans) ? m.plans : [];
  }

  function getPlanId(p) {
    return String((p && (p.planId || (p.plan && p.plan.id) || p.id)) || "");
  }

  function getPriceId(p) {
    var pay = (p && p.payment) || {};
    return String(pay.priceId || (p && p.priceId) || "");
  }

  function getPlanLabel(p) {
    var pay = (p && p.payment) || {};
    return [p && p.planId, p && p.planName, p && p.name, p && p.priceName, pay.priceName, pay.priceId]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();
  }

  function isPlanObjectActive(p) {
    var st = normalizeStatus(p && p.status);
    if (st) return !!ACTIVE_STATUSES[st];
    if (typeof (p && p.active) === "boolean") return p.active;
    return false;
  }

  function hasAgiloshieldClassic(member) {
    function matches(plan) {
      var planId = getPlanId(plan);
      var priceId = getPriceId(plan);
      var label = getPlanLabel(plan);
      return (
        planId.indexOf("pln_agiloshield") === 0 ||
        planId.indexOf("pln_agiloshield-classic") === 0 ||
        priceId === AGILOSHIELD_CLASSIC_PRICE_ID ||
        label.indexOf("agiloshield") !== -1 ||
        label.indexOf("classic mensuel") !== -1
      );
    }
    var connections = getConnections(member);
    if (connections.length > 0) {
      return connections.some(function (p) {
        return ACTIVE_STATUSES[normalizeStatus(p && p.status)] && matches(p);
      });
    }
    return getPlans(member).some(function (p) {
      return isPlanObjectActive(p) && matches(p);
    });
  }

  function waitForMemberstack(timeoutMs) {
    var start = Date.now();
    function poll() {
      if (window.$memberstackDom) return Promise.resolve(window.$memberstackDom);
      if (Date.now() - start >= timeoutMs) return Promise.resolve(null);
      return sleep(120).then(poll);
    }
    return poll();
  }

  function fetchMember(ms, useCache) {
    return ms
      .getCurrentMember({ useCache: useCache !== false })
      .then(function (res) {
        return (res && res.data) || null;
      })
      .catch(function (e) {
        console.warn("[Agiloshield skill gate] getCurrentMember failed", e);
        return null;
      });
  }

  function buildPricingUrl() {
    var ret = encodeURIComponent(RETURN_PATH + "?upgraded=1");
    return PRICING_BASE + "?return=" + ret;
  }

  function checkClassicAccess() {
    return waitForMemberstack(8000).then(function (ms) {
      if (!ms) return true;
      return fetchMember(ms, false).then(function (member) {
        if (!member) return false;
        return hasAgiloshieldClassic(member);
      });
    });
  }

  function showUpsellOverlay() {
    if (!upsellOverlay) return;
    var pricingLink = upsellOverlay.querySelector(".ags-upsell-cta");
    if (pricingLink) pricingLink.href = buildPricingUrl();
    upsellOverlay.hidden = false;
    upsellOverlay.setAttribute("aria-hidden", "false");
    upsellOverlay.classList.add("ags-upsell-overlay--open");
    document.documentElement.classList.add("ags-upsell-open");
    var closeBtn = upsellOverlay.querySelector(".ags-upsell-close");
    if (closeBtn) closeBtn.focus();
  }

  function hideUpsellOverlay() {
    if (!upsellOverlay) return;
    upsellOverlay.classList.remove("ags-upsell-overlay--open");
    upsellOverlay.hidden = true;
    upsellOverlay.setAttribute("aria-hidden", "true");
    document.documentElement.classList.remove("ags-upsell-open");
  }

  function openDrawerWithGate() {
    return checkClassicAccess().then(function (hasAccess) {
      if (!hasAccess) {
        showUpsellOverlay();
        return false;
      }
      openDrawer();
      return true;
    });
  }

  function onOpenClick(e) {
    var t = e.target.closest("[data-ags-open-drawer]");
    if (!t || gateClickInProgress) return;
    e.preventDefault();
    e.stopPropagation();
    gateClickInProgress = true;
    openDrawerWithGate().finally(function () {
      gateClickInProgress = false;
    });
  }

  document.addEventListener("click", onOpenClick, true);

  system.querySelectorAll("[data-ags-drawer-close]").forEach(function (el) {
    el.addEventListener("click", closeDrawer);
  });

  if (upsellOverlay) {
    upsellOverlay.querySelectorAll("[data-ags-upsell-close]").forEach(function (el) {
      el.addEventListener("click", hideUpsellOverlay);
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (upsellOverlay && upsellOverlay.classList.contains("ags-upsell-overlay--open")) {
      hideUpsellOverlay();
      return;
    }
    if (system.classList.contains("ags-drawer-system--open")) {
      closeDrawer();
    }
  });

  var params = new URLSearchParams(window.location.search);
  var upgraded =
    params.get("upgraded") === "1" || params.get("upgraded") === "true";
  var hashOpen =
    window.location.hash === "#open-skill-gen" ||
    window.location.hash === "#ags-open-drawer";

  if (upgraded) {
    openDrawer();
  } else if (hashOpen) {
    openDrawerWithGate();
  }

  window.AgsSkillDrawer = {
    open: openDrawer,
    close: closeDrawer,
    openWithGate: openDrawerWithGate,
    showUpsell: showUpsellOverlay,
    hideUpsell: hideUpsellOverlay,
    checkClassicAccess: checkClassicAccess,
  };
})();
</script>
