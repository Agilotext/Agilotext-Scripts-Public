<!-- Dashboard premium : 1 seul embed en bas de page (HORS embed anonymisation) -->
<!-- Ne pas coller skill-generator-embed.html ici — chargement lazy via CDN -->
<div id="ags-drawer-system" class="ags-drawer-system" hidden aria-hidden="true">
  <div class="ags-drawer-backdrop" data-ags-drawer-close tabindex="-1"></div>
  <aside class="ags-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="ags-drawer-title">
    <header class="ags-drawer-head">
      <div class="ags-drawer-head-brand">
        <img
          class="ags-drawer-logo"
          src="https://cdn.prod.website-files.com/6815bee5a9c0b57da18354fb/6a1f116a08744afd7c5e0ee9_claude-color.png"
          alt=""
          width="24"
          height="24"
          decoding="async"
        />
        <div class="ags-drawer-head-text">
          <h2 id="ags-drawer-title" class="ags-drawer-title">Claude Cowork</h2>
          <p class="ags-drawer-subtitle">Configurer votre skill Agiloshield</p>
        </div>
      </div>
      <button type="button" class="ags-drawer-close" data-ags-drawer-close aria-label="Fermer">×</button>
    </header>
    <div id="ags-drawer-mount" class="ags-drawer-body" data-ags-in-drawer></div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  var EMBED_CDN =
    "https://cdn.jsdelivr.net/gh/Agilotext/Agilotext-Scripts-Public@6d5ec2b/CNOEC_Agiloshield_Docs/Agiloshield-Skill/skill-generator-embed.html";

  var system = document.getElementById("ags-drawer-system");
  var mount = document.getElementById("ags-drawer-mount");
  if (!system || !mount) return;

  var embedLoaded = false;
  var embedLoading = false;

  function rehydrateScripts(container) {
    var scripts = Array.prototype.slice.call(container.querySelectorAll("script"));
    return new Promise(function (resolve) {
      function runNext(i) {
        if (i >= scripts.length) return resolve();
        var old = scripts[i];
        var type = (old.getAttribute("type") || "").toLowerCase();
        if (type === "application/json" || type === "text/json") {
          return runNext(i + 1);
        }
        var s = document.createElement("script");
        if (old.src) {
          s.src = old.src;
          s.onload = function () {
            old.remove();
            runNext(i + 1);
          };
          s.onerror = function () {
            console.error("[Agiloshield skill drawer] script load failed", old.src);
            old.remove();
            runNext(i + 1);
          };
          old.parentNode.replaceChild(s, old);
        } else {
          s.textContent = old.textContent;
          old.parentNode.replaceChild(s, old);
          runNext(i + 1);
        }
      }
      runNext(0);
    });
  }

  function loadEmbed() {
    if (embedLoaded || embedLoading) return Promise.resolve();
    embedLoading = true;
    mount.innerHTML =
      '<div class="ags-drawer-loading"><div class="ags-drawer-spinner" aria-hidden="true"></div><p>Chargement…</p></div>';

    return fetch(EMBED_CDN)
      .then(function (r) {
        if (!r.ok) throw new Error("CDN " + r.status);
        return r.text();
      })
      .then(function (html) {
        mount.innerHTML = "";
        var wrap = document.createElement("div");
        wrap.innerHTML = html;
        while (wrap.firstChild) mount.appendChild(wrap.firstChild);
        return rehydrateScripts(mount);
      })
      .then(function () {
        embedLoaded = true;
      })
      .catch(function (e) {
        console.error("[Agiloshield skill drawer]", e);
        mount.innerHTML =
          '<p class="ags-drawer-error">Impossible de charger le générateur. Rechargez la page.</p>';
      })
      .finally(function () {
        embedLoading = false;
      });
  }

  function openDrawer() {
    system.hidden = false;
    system.setAttribute("aria-hidden", "false");
    system.classList.add("ags-drawer-system--open");
    document.documentElement.classList.add("ags-drawer-open");
    loadEmbed().then(function () {
      var closeBtn = system.querySelector(".ags-drawer-close");
      if (closeBtn) closeBtn.focus();
    });
  }

  function closeDrawer() {
    system.classList.remove("ags-drawer-system--open");
    system.hidden = true;
    system.setAttribute("aria-hidden", "true");
    document.documentElement.classList.remove("ags-drawer-open");
  }

  function onOpenClick(e) {
    var t = e.target.closest("[data-ags-open-drawer]");
    if (!t) return;
    e.preventDefault();
    e.stopPropagation();
    openDrawer();
  }

  document.addEventListener("click", onOpenClick, true);

  system.querySelectorAll("[data-ags-drawer-close]").forEach(function (el) {
    el.addEventListener("click", closeDrawer);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && system.classList.contains("ags-drawer-system--open")) {
      closeDrawer();
    }
  });

  var params = new URLSearchParams(window.location.search);
  if (
    params.get("upgraded") === "1" ||
    params.get("upgraded") === "true" ||
    window.location.hash === "#open-skill-gen" ||
    window.location.hash === "#ags-open-drawer"
  ) {
    openDrawer();
  }

  window.AgsSkillDrawer = { open: openDrawer, close: closeDrawer };
})();
</script>
