<!-- Agiloshield — panneau latéral générateur de skill (dashboard Webflow) -->
<!-- Coller en bas de la page dashboard premium, HORS de l'embed anonymisation -->
<div id="ags-drawer-system" class="ags-drawer-system" hidden aria-hidden="true">
  <div class="ags-drawer-backdrop" data-ags-drawer-close tabindex="-1"></div>
  <aside class="ags-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="ags-drawer-title">
    <header class="ags-drawer-head">
      <div class="ags-drawer-head-brand">
        <img
          class="ags-drawer-logo"
          src="https://cdn.prod.website-files.com/6815bee5a9c0b57da18354fb/6a1f116a08744afd7c5e0ee9_claude-color.png"
          alt=""
          width="28"
          height="28"
          decoding="async"
        />
        <h2 id="ags-drawer-title" class="ags-drawer-title">Intégration Claude Cowork</h2>
      </div>
      <button type="button" class="ags-drawer-close" data-ags-drawer-close aria-label="Fermer">×</button>
    </header>
    <div class="ags-drawer-body">
      <iframe
        id="ags-drawer-iframe"
        class="ags-drawer-iframe"
        title="Générateur de skill Agiloshield"
        loading="lazy"
      ></iframe>
    </div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  const GENERATE_SKILL_PATH = "/tools/agiloshield/generate-skill";
  const DRAWER_QUERY = "?drawer=1";
  let iframeLoaded = false;

  const system = document.getElementById("ags-drawer-system");
  const iframe = document.getElementById("ags-drawer-iframe");
  if (!system || !iframe) return;

  function iframeSrc() {
    const upgraded = new URLSearchParams(window.location.search).get("upgraded");
    let url = GENERATE_SKILL_PATH + DRAWER_QUERY;
    if (upgraded === "1" || upgraded === "true") {
      url += "&upgraded=1";
    }
    return url;
  }

  function openDrawer() {
    if (!iframeLoaded) {
      iframe.src = iframeSrc();
      iframeLoaded = true;
    }
    system.hidden = false;
    system.setAttribute("aria-hidden", "false");
    system.classList.add("ags-drawer-system--open");
    document.documentElement.classList.add("ags-drawer-open");
    const closeBtn = system.querySelector(".ags-drawer-close");
    if (closeBtn) closeBtn.focus();
  }

  function closeDrawer() {
    system.classList.remove("ags-drawer-system--open");
    system.hidden = true;
    system.setAttribute("aria-hidden", "true");
    document.documentElement.classList.remove("ags-drawer-open");
  }

  function onOpenClick(e) {
    const t = e.target.closest("[data-ags-open-drawer], .agf-skill-cta[data-ags-open-drawer]");
    if (!t) return;
    e.preventDefault();
    openDrawer();
  }

  document.addEventListener("click", onOpenClick);

  system.querySelectorAll("[data-ags-drawer-close]").forEach((el) => {
    el.addEventListener("click", closeDrawer);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && system.classList.contains("ags-drawer-system--open")) {
      closeDrawer();
    }
  });

  if (window.location.hash === "#open-skill-gen" || window.location.hash === "#ags-open-drawer") {
    openDrawer();
  }

  window.AgsSkillDrawer = { open: openDrawer, close: closeDrawer };
})();
</script>

<style>
.ags-drawer-system {
  position: fixed;
  inset: 0;
  z-index: 99990;
  pointer-events: none;
}
.ags-drawer-system--open {
  pointer-events: auto;
}
.ags-drawer-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(9, 20, 44, 0.45);
  opacity: 0;
  transition: opacity 0.25s ease;
}
.ags-drawer-system--open .ags-drawer-backdrop {
  opacity: 1;
}
.ags-drawer-panel {
  position: absolute;
  top: 0;
  right: 0;
  width: min(100%, 32rem);
  max-width: 100vw;
  height: 100%;
  background: #fff;
  box-shadow: -8px 0 32px rgba(0, 0, 0, 0.12);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.28s ease;
}
.ags-drawer-system--open .ags-drawer-panel {
  transform: translateX(0);
}
.ags-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  border-bottom: 1px solid rgba(52, 58, 64, 0.12);
  flex-shrink: 0;
}
.ags-drawer-head-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}
.ags-drawer-title {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  color: #020202;
  font-family: "Inter", "SF Pro Text", "Segoe UI", sans-serif;
}
.ags-drawer-close {
  border: 0;
  background: transparent;
  font-size: 1.75rem;
  line-height: 1;
  cursor: pointer;
  color: #525252;
  padding: 0.25rem 0.5rem;
  border-radius: 0.35rem;
}
.ags-drawer-close:hover {
  background: rgba(0, 0, 0, 0.06);
}
.ags-drawer-body {
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.ags-drawer-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}
html.ags-drawer-open {
  overflow: hidden;
}
@media (max-width: 480px) {
  .ags-drawer-panel {
    width: 100%;
  }
}
</style>
